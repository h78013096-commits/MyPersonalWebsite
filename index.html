<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #17243A, #3B5998);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #C5A15B;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #A88643;
            transform: scale(1.05);
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Website!</h1>

        <p>
            Hello Everyone! Welcome to my first website.
            I am glad to have you here.
        </p>

        <a href="#" class="btn" onclick="showMessage(event)">
            Get Started
        </a>
    </div>

    <footer>
        &copy; 2026 My Website. All Rights Reserved.
    </footer>

    <script>
        function showMessage(event) {
            event.preventDefault();
            alert("Welcome to my website! Thank you for visiting.");
        }
    </script>

</body>
</html>
